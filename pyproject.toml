[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repomedic"
version = "0.1.1"
description = "Open-source repository diagnostics toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "RepoMedic Contributors" }
]
keywords = ["diagnostics", "linter", "security", "ci", "repository", "hygiene"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aliasnull/RepoMedic"
Repository = "https://github.com/aliasnull/RepoMedic"
Issues = "https://github.com/aliasnull/RepoMedic/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
repomedic = "repomedic.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["repomedic*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
